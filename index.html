<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Libreta de Gastos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen ledger app — month header, total + budget, category strip, day-grouped list, floating add button opening a bottom sheet */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#15211c; --muted:#5f6d66; --line:#dfe5df;
  --accent:#0e7a5c; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --warn:#b7791f; --danger:#c2412d; --danger-soft:#fbe6e1;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#8a948f;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 10px 30px rgba(21,33,28,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#16201d; --ink:#e8efeb; --muted:#93a39b; --line:#26332e;
  --accent:#3fbf91; --accent-ink:#06120d; --accent-soft:#16352a;
  --warn:#e0a84a; --danger:#ec7a64; --danger-soft:#3a1d18;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#7d8a84;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#16201d; --ink:#e8efeb; --muted:#93a39b; --line:#26332e;
  --accent:#3fbf91; --accent-ink:#06120d; --accent-soft:#16352a;
  --warn:#e0a84a; --danger:#ec7a64; --danger-soft:#3a1d18;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#7d8a84;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px 180px}
.tab{display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;min-width:9.5ch;text-align:center;text-transform:capitalize}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}

/* summary */
.summary{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,12vw,3.4rem);line-height:1;letter-spacing:-.02em;margin:0}
.budget{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--danger)}
.budget-row{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted)}
.budget-row b{color:var(--ink);font-weight:600}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.over{background:var(--danger-soft);color:var(--danger)}
.link{color:var(--accent);font-weight:600;font-size:.88rem;padding:0}

/* categories */
.cats{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.strip>i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;font-size:.88rem;min-width:0}
.legend .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pct{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* list */
.day{display:flex;flex-direction:column;gap:2px}
.day-head{display:flex;justify-content:space-between;padding:0 4px 6px;font-size:.8rem;color:var(--muted);font-weight:600}
.day-head span:first-child{text-transform:capitalize}
.rows{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none;color:#fff}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:.8rem;color:var(--muted)}
.row .amt{font-family:var(--f-mono);font-size:.95rem;white-space:nowrap}

.empty{background:var(--surface);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--f-display);font-size:1.2rem;margin:0}
.empty p{margin:0;color:var(--muted);max-width:32ch;line-height:1.45}
.notice{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.4}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:15px 26px;font-weight:600;font-size:1.02rem;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:5}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar>i{transition:none}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-family:var(--f-display);font-size:1.2rem;margin:0}
.amount-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount-wrap:focus-within{border-color:var(--accent)}
.amount-wrap span{font-family:var(--f-display);font-size:1.6rem;color:var(--muted)}
#f-amount{font-family:var(--f-display);font-weight:700;font-size:2.6rem;border:0;background:none;color:var(--ink);width:100%;min-width:0;padding:0;outline:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-weight:600;font-size:1.02rem;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.danger{color:var(--danger);font-weight:600;padding:12px;border-radius:14px;width:100%}
.danger.armed{background:var(--danger);color:#fff}
.err{color:var(--danger);font-size:.85rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;box-shadow:var(--shadow)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-inner{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:520px}
.tabbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:.74rem;font-weight:600;color:var(--muted);border-radius:12px}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-selected="true"]{color:var(--accent)}

/* dashboard */
.dash-head{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.dash-head h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:9px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.range{font-size:.82rem;color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.wide{grid-column:1/-1}
.kpi .k{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.1;overflow-wrap:anywhere}
.kpi.wide .v{font-size:2.2rem}
.kpi .s{font-size:.8rem;color:var(--muted);line-height:1.35}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.82rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink)}
.delta.up{color:var(--danger);background:var(--danger-soft)}
.delta.down{color:var(--accent);background:var(--accent-soft)}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-size:1.08rem;margin:0}
.card .sub{font-size:.8rem;color:var(--muted);margin:-8px 0 0}
.chart{position:relative;width:100%;min-width:0;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.chart .reflbl{fill:var(--warn);font-size:10px;font-weight:600;font-family:var(--f-body)}
.chart .dlbl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-body)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{transition:opacity .15s}
.chart .cross{stroke:var(--muted);stroke-width:1}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:14px;height:0;border-top:2px solid}
.chart-legend i.dash{border-top-style:dashed}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.8rem;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:110px}
.tip .tt{font-weight:600;opacity:.75;font-size:.74rem;text-transform:capitalize}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip .tr i{width:12px;height:0;border-top:2px solid}
.tip b{font-variant-numeric:tabular-nums}
.ctable{width:100%;border-collapse:collapse;font-size:.88rem}
.ctable th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:0 0 8px}
.ctable th:first-child{text-align:left}
.ctable td{padding:9px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctable td:first-child{text-align:left;white-space:normal}
.ctable .cn{display:flex;flex-direction:column;gap:6px}
.ctable .cn span{display:flex;align-items:center;gap:8px}
.ctable .mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:160px}
.ctable .mini i{display:block;height:100%;border-radius:3px}
.ctable .pc{color:var(--muted);font-family:var(--f-mono);font-size:.78rem;padding-left:10px}
.ctable .dl{font-size:.78rem;padding-left:10px;font-weight:600}
.ctable .dl.up{color:var(--danger)} .ctable .dl.down{color:var(--accent)} .ctable .dl.flat{color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:.75rem;color:var(--muted)}
.fact .v{font-weight:600;overflow-wrap:anywhere}
</style>

<main class="app" id="app">
<div class="tab" id="tab-gastos">
  <header class="top">
    <button class="icon-btn" id="prev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="month"><h1 id="month-label">—</h1></div>
    <div style="display:flex">
      <button class="icon-btn" id="next" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icon-btn" id="open-settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <section class="summary" aria-label="Resumen del mes">
    <span class="eyebrow">Gastado este mes</span>
    <p class="total num" id="total">—</p>
    <div class="budget" id="budget"></div>
  </section>

  <section class="cats" id="cats" hidden aria-label="Por categoría">
    <span class="eyebrow">Por categoría</span>
    <div class="strip" id="strip"></div>
    <ul class="legend" id="legend"></ul>
  </section>

  <section id="list" aria-label="Movimientos"></section>
</div>

<div class="tab" id="tab-analisis" hidden>
  <header class="dash-head">
    <h1>Análisis</h1>
    <div class="seg" role="group" aria-label="Periodo">
      <button type="button" data-p="1" aria-pressed="true">Mes</button>
      <button type="button" data-p="3" aria-pressed="false">3 meses</button>
      <button type="button" data-p="6" aria-pressed="false">6 meses</button>
      <button type="button" data-p="12" aria-pressed="false">Año</button>
    </div>
    <p class="range" id="d-range"></p>
  </header>
  <div id="dash"></div>
</div>
<p class="notice" id="notice" hidden></p>
</main>

<button class="fab" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Añadir gasto</button>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-inner" role="tablist">
    <button class="tabbtn" role="tab" id="tb-gastos" aria-selected="true" aria-controls="tab-gastos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Gastos</button>
    <button class="tabbtn" role="tab" id="tb-analisis" aria-selected="false" aria-controls="tab-analisis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</button>
  </div>
</nav>
<div class="tip" id="tip" hidden></div>

<div class="scrim" id="expense-sheet" hidden>
  <form class="sheet" id="expense-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <div class="grip"></div>
    <div class="sheet-head"><h2 id="sheet-title">Nuevo gasto</h2><button type="button" class="link" data-close>Cancelar</button></div>
    <div class="amount-wrap"><span id="cur-sym">$</span><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Importe"></div>
    <div class="field"><span class="lbl">Categoría</span><div class="chips" id="f-cats" role="group" aria-label="Categoría"></div></div>
    <div class="two">
      <div class="field"><label for="f-date">Fecha</label><input class="input" type="date" id="f-date"></div>
      <div class="field"><label for="f-note">Nota</label><input class="input" id="f-note" maxlength="60" placeholder="Opcional"></div>
    </div>
    <p class="err" id="f-err" hidden></p>
    <button class="primary" id="f-save" type="submit">Guardar</button>
    <button class="danger" id="f-delete" type="button" hidden>Eliminar gasto</button>
  </form>
</div>

<div class="scrim" id="settings-sheet" hidden>
  <form class="sheet" id="settings-form" role="dialog" aria-modal="true" aria-labelledby="set-title" novalidate>
    <div class="grip"></div>
    <div class="sheet-head"><h2 id="set-title">Ajustes</h2><button type="button" class="link" data-close>Cerrar</button></div>
    <div class="field"><label for="s-budget">Presupuesto mensual</label><input class="input num" id="s-budget" inputmode="decimal" placeholder="Sin presupuesto"></div>
    <div class="field"><label for="s-currency">Moneda</label>
      <select class="input" id="s-currency">
        <option value="ARS">Peso argentino (ARS)</option><option value="MXN">Peso mexicano (MXN)</option>
        <option value="COP">Peso colombiano (COP)</option><option value="CLP">Peso chileno (CLP)</option>
        <option value="UYU">Peso uruguayo (UYU)</option><option value="PEN">Sol peruano (PEN)</option>
        <option value="EUR">Euro (EUR)</option><option value="USD">Dólar (USD)</option>
      </select></div>
    <button class="primary" type="submit">Guardar ajustes</button>
    <button class="link" type="button" id="export" hidden style="align-self:center;padding:8px">Exportar todos los gastos (CSV)</button>
  </form>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const CATS = [
    {id:"comida", name:"Comida", c:"--c1"}, {id:"super", name:"Supermercado", c:"--c2"},
    {id:"transporte", name:"Transporte", c:"--c3"}, {id:"casa", name:"Casa", c:"--c4"},
    {id:"servicios", name:"Servicios", c:"--c5"}, {id:"salud", name:"Salud", c:"--c6"},
    {id:"ocio", name:"Ocio", c:"--c7"}, {id:"compras", name:"Compras", c:"--c8"},
    {id:"otros", name:"Otros", c:"--c9"}];
  const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
  const $ = s => document.querySelector(s);
  const LOCALE = (navigator.language || "es-ES").startsWith("es") ? navigator.language : "es-ES";
  const guessCurrency = () => {
    const m = {"es-AR":"ARS","es-MX":"MXN","es-CO":"COP","es-CL":"CLP","es-UY":"UYU","es-PE":"PEN","es-ES":"EUR","en-US":"USD"};
    return m[navigator.language] || "USD";

  const pad = n => String(n).padStart(2, "0");

  const ym = d => ymd(d).slice(0, 7);
  const money = v => {
    try { return new Intl.NumberFormat(LOCALE, {style:"currency", currency:settings.currency, maximumFractionDigits: settings.currency === "CLP" ? 0 : 2}).format(v); }
    catch { return v.toFixed(2); }
  };
  const symbol = () => {
    try { return new Intl.NumberFormat(LOCALE, {style:"currency", currency:settings.currency}).formatToParts(0).find(p => p.type === "currency").value; }
    catch { return "$"; }
  };
  const parseAmount = s => {
    s = String(s || "").trim().replace(/\s/g, "");
    if (!s) return NaN;
    // Accept "1.234,56", "1,234.56", "12,5", "12.5"
    const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    else if (lc > -1) s = /,\d{3}$/.test(s) && s.split(",").length > 2 ? s.replace(/,/g, "") : s.replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;

    save() { try { localStorage.setItem(LS_KEY, JSON.stringify({expenses, settings})); } catch {} },

    async add(e) {

    },
    async update(id, e) {
      if (remote) return remote.col.doc(id).set(e);

    },
    async remove(id) {

      expenses = expenses.filter(x => x.id !== id); local.save(); render();
    },
    async saveSettings(s) {

  async function connect() {

      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { showNotice("local"); return; }
      const profile = db.doc("data/users/" + uid + "/profile");
      const col = profile.collection("expenses");
      remote = {profile, col};
      profile.onSnapshot(s => { if (s.exists) { Object.assign(settings, s.data()); render(); } }, () => {});
      col.onSnapshot(snap => {
        expenses = snap.docs.map(d => ({id: d.id, ...d.data()}));
        $("#notice").hidden = true;
        render();
      }, () => { remote = null; showNotice("local"); local.load(); render(); });

  function showNotice(kind) {

  /* ---------- render ---------- */

  function renderList() {

    const total = month.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    $("#total").textContent = money(total);

    // budget
    const b = $("#budget"); b.innerHTML = "";
    const budget = Number(settings.budget) || 0;
    if (budget > 0) {
      const pct = total / budget, left = budget - total;
      const bar = document.createElement("div");
      bar.className = "bar" + (pct > 1 ? " over" : pct > .85 ? " warn" : "");
      bar.innerHTML = `<i style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i>`;
      bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-valuenow", Math.round(pct * 100));
      bar.setAttribute("aria-valuemin", 0); bar.setAttribute("aria-valuemax", 100);

        perDay = ` · ${money(left / days)}/día`;

      b.append(bar, row);
    } else {
      const btn = document.createElement("button"); btn.className = "link"; btn.style.alignSelf = "flex-start";
      btn.textContent = "Fijar un presupuesto mensual"; btn.onclick = openSettings; b.append(btn);
    }

    // categories
    const byCat = {};
    month.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + Number(e.amount || 0));
    const ranked = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    $("#cats").hidden = !ranked.length || total <= 0;
    $("#strip").innerHTML = ranked.map(([c, v]) => `<i style="width:${(v / total * 100).toFixed(2)}%;background:var(${catById(c).c})" title="${catById(c).name}"></i>`).join("");

      return;
    }
    const groups = {};
    month.forEach(e => (groups[e.date] ||= []).push(e));
    const today = ymd(new Date()), yest = ymd(new Date(Date.now() - 864e5));
    const wrap = document.createElement("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:16px";
    for (const [date, items] of Object.entries(groups)) {
      const d = new Date(date + "T12:00:00");
      const name = date === today ? "Hoy" : date === yest ? "Ayer" : d.toLocaleDateString(LOCALE, {weekday:"long", day:"numeric"});
      const sum = items.reduce((s, e) => s + Number(e.amount || 0), 0);

      day.innerHTML = `<div class="day-head"><span>${name}</span><span class="num">${money(sum)}</span></div>`;
      const rows = document.createElement("div"); rows.className = "rows";
      items.forEach(e => {
        const c = catById(e.cat);
        const r = document.createElement("button"); r.className = "row";
        r.innerHTML = `<span class="badge" style="background:var(${c.c})">${c.name[0]}</span>
          <span class="txt"><span class="t1"></span><span class="t2"></span></span><span class="amt num">${money(Number(e.amount))}</span>`;
        r.querySelector(".t1").textContent = e.note || c.name;
        r.querySelector(".t2").textContent = e.note ? c.name : "";

  /* ---------- sheets ---------- */
  function openSheet(el) { el.hidden = false; }

  $("#expense-form").addEventListener("submit", async ev => {

      if (!date.startsWith(ym(view))) { view = new Date(date + "T12:00:00"); view.setDate(1); render(); }

  });

  function openSettings() {

  $("#export").onclick = async () => {
    const dl = await claude.use("downloads"); if (!dl) return;

      ...[...expenses].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, esc(catById(e.cat).name), esc(e.note), e.amount, settings.currency].join(","))];
    try { await dl.save({filename: `gastos-${ymd(new Date())}.csv`, data: rows.join("\n")}); } catch {}
  };

  $("#add").onclick = () => openExpense(null);
  $("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  $("#next").onclick = () => { if (!$("#next").disabled) { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); } };

  /* ---------- dashboard ---------- */
  let period = 1;
  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const compact = v => { try { return new Intl.NumberFormat(LOCALE, {notation:"compact", maximumFractionDigits:1}).format(v); } catch { return String(Math.round(v)); } };
  const addMonths = (d, n) => { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate(); r.setDate(Math.min(d.getDate(), last)); return r; };
  const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5) + 1;
  const total$ = arr => arr.reduce((s, e) => s + Number(e.amount || 0), 0);
  const fmtPct = p => (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(Math.round(p * 100)) + "%";
  const longDate = date => new Date(date + "T12:00:00").toLocaleDateString(LOCALE, {weekday:"long", day:"numeric", month:"long"});

  const tipEl = $("#tip");
  function showTip(ev, title, rows) {
    tipEl.textContent = "";
    const t = document.createElement("span"); t.className = "tt"; t.textContent = title; tipEl.append(t);
    rows.forEach(r => {
      const row = document.createElement("span"); row.className = "tr";
      if (r.color) { const i = document.createElement("i"); i.style.borderColor = r.color; row.append(i); }
      const b = document.createElement("b"); b.textContent = r.value; row.append(b);
      if (r.label) row.append(document.createTextNode(" " + r.label));
      tipEl.append(row);
    });
    tipEl.hidden = false;
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = ev.clientX - w / 2, y = ev.clientY - h - 16;
    x = Math.max(8, Math.min(innerWidth - w - 8, x)); if (y < 8) y = ev.clientY + 20;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  }
  const hideTip = () => { tipEl.hidden = true; };
  document.addEventListener("pointerdown", ev => { if (!ev.target.closest(".chart")) hideTip(); });
  addEventListener("scroll", hideTip, {passive:true});

  function niceTicks(max) {
    if (!(max > 0)) return [0, 1];
    const raw = max / 3, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
    const t = []; for (let v = 0; v <= max + step * 1e-6; v += step) t.push(v);
    if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
    return t;
  }
  function frame(host, maxVal) {
    const W = Math.max(260, Math.round(host.clientWidth || 320)), H = 190, L = 42, R = 12, T = 16, B = 24;
    const ticks = niceTicks(maxVal), yMax = ticks[ticks.length - 1];
    const y = v => T + (H - T - B) * (1 - v / yMax);
    const s = svg("svg", {viewBox:`0 0 ${W} ${H}`, role:"img"});
    ticks.forEach(t => {
      svg("line", {x1:L, x2:W - R, y1:y(t), y2:y(t), class:"grid"}, s);
      svg("text", {x:L - 6, y:y(t) + 3, "text-anchor":"end", class:"axis"}, s).textContent = compact(t);
    });
    return {W, H, L, R, T, B, y, s};
  }
  function refLine(f, ref, label) {
    if (!(ref > 0)) return;
    svg("line", {x1:f.L, x2:f.W - f.R, y1:f.y(ref), y2:f.y(ref), class:"ref"}, f.s);
    svg("text", {x:f.W - f.R, y:f.y(ref) - 5, "text-anchor":"end", class:"reflbl"}, f.s).textContent = label;
  }

  function barChart(host, items, {ref, refLabel, maxLabels = 7} = {}) {
    const f = frame(host, Math.max(...items.map(i => i.value), ref || 0));
    const band = (f.W - f.L - f.R) / items.length, bw = Math.max(3, Math.min(30, band * .66));
    const every = Math.ceil(items.length / maxLabels), base = f.y(0), bars = [];
    items.forEach((it, i) => {
      const x = f.L + i * band + (band - bw) / 2, top = f.y(it.value);
      if (it.value > 0) {
        const r = Math.min(4, bw / 2, base - top);
        bars[i] = svg("path", {class:"bar", fill:"var(--accent)", d:`M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z`}, f.s);
      }
      if (i % every === 0) svg("text", {x:x + bw / 2, y:f.H - 7, "text-anchor":"middle", class:"axis"}, f.s).textContent = it.label;
    });
    refLine(f, ref, refLabel);
    const reset = () => bars.forEach(b => b && (b.style.opacity = 1));
    items.forEach((it, i) => {
      const hit = svg("rect", {x:f.L + i * band, y:f.T, width:band, height:base - f.T, class:"hit", tabindex:0, "aria-label":`${it.title}: ${money(it.value)}`}, f.s);
      const show = ev => { bars.forEach((b, j) => b && (b.style.opacity = j === i ? 1 : .4)); showTip(ev, it.title, [{value:money(it.value), label:it.extra || ""}]); };
      hit.addEventListener("pointerdown", show); hit.addEventListener("pointermove", show);
      hit.addEventListener("pointerleave", ev => { if (ev.pointerType !== "touch") { reset(); hideTip(); } });
      hit.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); show({clientX:r.left + r.width / 2, clientY:r.top + 30}); });
      hit.addEventListener("blur", () => { reset(); hideTip(); });
    });
    host.append(f.s);
  }

  function lineChart(host, series, xMax, {ref, refLabel} = {}) {
    const all = series.flatMap(s => s.points.filter(v => v != null));
    const f = frame(host, Math.max(...all, ref || 0, 0));
    const x = d => f.L + (f.W - f.L - f.R) * (d - 1) / (xMax - 1);
    [1, 5, 10, 15, 20, 25, 30].filter(d => d <= xMax).forEach(d =>
      svg("text", {x:x(d), y:f.H - 7, "text-anchor":"middle", class:"axis"}, f.s).textContent = d);
    refLine(f, ref, refLabel);
    const ends = [];
    series.forEach(sr => {
      const pts = sr.points.map((v, i) => v == null ? null : [x(i + 1), f.y(v)]).filter(Boolean);
      if (!pts.length) return;
      svg("path", {d:"M" + pts.map(p => p.join(",")).join("L"), fill:"none", stroke:sr.color, "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round", "stroke-dasharray":sr.dash ? "5 4" : "none"}, f.s);
      const [ex, ey] = pts[pts.length - 1];
      svg("circle", {cx:ex, cy:ey, r:4, fill:sr.color, stroke:"var(--surface)", "stroke-width":2}, f.s);
      ends.push({ex, ey, sr});
    });
    // direct labels at line ends, nudged apart when they collide
    ends.sort((a, b) => a.ey - b.ey);
    let lastY = -Infinity;
    ends.forEach(e => {
      let ly = Math.max(e.ey - 9, f.T + 2); if (ly - lastY < 13) ly = lastY + 13; lastY = ly;
      const left = e.ex > f.W - 90;
      svg("text", {x:left ? e.ex - 8 : e.ex + 8, y:ly, "text-anchor":left ? "end" : "start", class:"dlbl"}, f.s).textContent = e.sr.name;
    });
    const cross = svg("line", {y1:f.T, y2:f.y(0), class:"cross", visibility:"hidden"}, f.s);
    const hit = svg("rect", {x:f.L, y:f.T, width:f.W - f.L - f.R, height:f.y(0) - f.T, class:"hit"}, f.s);
    const show = ev => {
      const r = f.s.getBoundingClientRect(), sx = (ev.clientX - r.left) * f.W / r.width;
      const d = Math.max(1, Math.min(xMax, Math.round(1 + (sx - f.L) / (f.W - f.L - f.R) * (xMax - 1))));
      cross.setAttribute("x1", x(d)); cross.setAttribute("x2", x(d)); cross.setAttribute("visibility", "visible");
      const rows = series.filter(s => s.points[d - 1] != null).map(s => ({color:s.color, value:money(s.points[d - 1]), label:s.name}));
      if (rows.length) showTip(ev, `Día ${d}`, rows); else hideTip();
    };
    hit.addEventListener("pointerdown", show); hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerleave", ev => { if (ev.pointerType !== "touch") { cross.setAttribute("visibility", "hidden"); hideTip(); } });
    host.append(f.s);
  }

  function card(title, sub) {
    const c = document.createElement("section"); c.className = "card";
    c.innerHTML = `<h2>${esc(title)}</h2>` + (sub ? `<p class="sub">${esc(sub)}</p>` : "");

  }
  function chartHost(parent) { const d = document.createElement("div"); d.className = "chart"; parent.append(d); return d; }
  function deltaPill(cur, prev) {
    if (!(prev > 0)) return `<span class="delta">Sin datos para comparar</span>`;
    const p = (cur - prev) / prev;
    const cls = p > .005 ? "up" : p < -.005 ? "down" : "";
    const arrow = p > .005 ? "↑" : p < -.005 ? "↓" : "=";
    return `<span class="delta ${cls}">${arrow} ${fmtPct(p)}</span>`;
  }

  function renderDash() {
    const host = $("#dash"); host.textContent = ""; hideTip();
    host.style.cssText = "display:flex;flex-direction:column;gap:16px";
    const now = new Date(), today = ymd(now);
    const startD = new Date(now.getFullYear(), now.getMonth() - (period - 1), 1);
    const start = ymd(startD);
    const pStartD = addMonths(startD, -period), pEndD = addMonths(now, -period);
    const pStart = ymd(pStartD), pEnd = ymd(pEndD);
    const cur = expenses.filter(e => e.date >= start && e.date <= today);
    const prev = expenses.filter(e => e.date >= pStart && e.date <= pEnd);
    const fmtD = d => d.toLocaleDateString(LOCALE, {day:"numeric", month:"short"});
    $("#d-range").textContent = `Del ${fmtD(startD)} al ${fmtD(now)}. Se compara con el ${fmtD(pStartD)} – ${fmtD(pEndD)}.`;

    if (!cur.length) {
      host.innerHTML = `<div class="empty"><h2>Todavía no hay datos en este periodo</h2>
        <p>Cuando anotes gastos verás aquí tus totales, promedios, tendencias y en qué categorías gastas más.</p></div>`;
      return;
    }
    const total = total$(cur), prevTotal = total$(prev), n = cur.length;
    const days = daysBetween(start, today);
    const budget = Number(settings.budget) || 0;
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const biggest = cur.reduce((a, b) => Number(b.amount) > Number(a.amount) ? b : a);

    // KPIs
    let third;
    if (period === 1) {
      const proj = total / now.getDate() * dim;
      third = `<div class="kpi"><span class="k">Proyección del mes</span><span class="v num">${money(proj)}</span>
        <span class="s">${budget ? (proj > budget ? `Superaría tu presupuesto por ${money(proj - budget)}` : `Dentro del presupuesto`) : "Si sigues a este ritmo"}</span></div>`;
    } else {
      third = `<div class="kpi"><span class="k">Promedio mensual</span><span class="v num">${money(total / period)}</span>
        <span class="s">${budget ? (total / period > budget ? "Por encima de tu presupuesto" : "Por debajo de tu presupuesto") : `En ${period} meses`}</span></div>`;
    }
    const kp = document.createElement("div"); kp.className = "kpis";
    kp.innerHTML = `
      <div class="kpi wide"><span class="k">Total gastado</span><span class="v num">${money(total)}</span>
        <span class="s">${deltaPill(total, prevTotal)} ${prevTotal > 0 ? `frente a ${money(prevTotal)} en el periodo anterior` : ""}</span></div>
      <div class="kpi"><span class="k">Promedio diario</span><span class="v num">${money(total / days)}</span><span class="s">En ${days} ${days === 1 ? "día" : "días"}</span></div>
      ${third}
      <div class="kpi"><span class="k">Movimientos</span><span class="v num">${n}</span><span class="s">Gasto medio ${money(total / n)}</span></div>
      <div class="kpi"><span class="k">Gasto más alto</span><span class="v num">${money(Number(biggest.amount))}</span>
        <span class="s">${esc(biggest.note || catById(biggest.cat).name)} · ${esc(new Date(biggest.date + "T12:00:00").toLocaleDateString(LOCALE, {day:"numeric", month:"short"}))}</span></div>`;
    host.append(kp);

    // Evolution
    if (period === 1) {
      const c = card("Gasto por día", "Toca una barra para ver el detalle"); host.append(c);
      const byDay = Array.from({length:dim}, (_, i) => {
        const date = `${ym(now)}-${pad(i + 1)}`, items = cur.filter(e => e.date === date);
        return {label:String(i + 1), value:total$(items), title:longDate(date), extra:items.length ? `· ${items.length} ${items.length === 1 ? "gasto" : "gastos"}` : ""};
      });
      barChart(chartHost(c), byDay, {ref:budget ? budget / dim : 0, refLabel:"Presupuesto diario", maxLabels:7});
    } else {
      const c = card("Gasto por mes", "Toca una barra para ver el detalle"); host.append(c);
      const months = Array.from({length:period}, (_, i) => {
        const d = new Date(startD.getFullYear(), startD.getMonth() + i, 1), key = ym(d);
        const items = cur.filter(e => e.date.startsWith(key));
        return {label:d.toLocaleDateString(LOCALE, {month:"short"}).replace(".", ""), value:total$(items),
          title:d.toLocaleDateString(LOCALE, {month:"long", year:"numeric"}).replace(" de ", " "), extra:`· ${items.length} ${items.length === 1 ? "gasto" : "gastos"}`};
      });
      barChart(chartHost(c), months, {ref:budget, refLabel:"Presupuesto", maxLabels:period === 12 ? 6 : 6});
    }

    // Month pace (cumulative)
    {
      const c = card("Ritmo de este mes", "Gasto acumulado día a día"); host.append(c);
      const prevM = new Date(now.getFullYear(), now.getMonth() - 1, 1), pdim = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      const cum = (key, len, upto) => { let acc = 0; return Array.from({length:len}, (_, i) => {
        if (i + 1 > upto) return null;
        acc += total$(expenses.filter(e => e.date === `${key}-${pad(i + 1)}`)); return acc; }); };
      const xMax = Math.max(dim, pdim);
      const series = [
        {name:"Mes anterior", color:"var(--muted)", dash:true, points:cum(ym(prevM), xMax, pdim)},
        {name:"Este mes", color:"var(--accent)", points:cum(ym(now), xMax, now.getDate())}];
      const lg = document.createElement("div"); lg.className = "chart-legend";
      lg.innerHTML = `<span><i style="border-color:var(--accent)"></i>Este mes</span><span><i class="dash" style="border-color:var(--muted)"></i>Mes anterior</span>`
        + (budget ? `<span><i class="dash" style="border-color:var(--warn)"></i>Presupuesto</span>` : "");
      c.append(lg);
      lineChart(chartHost(c), series, xMax, {ref:budget, refLabel:"Presupuesto"});
    }

    // Categories
    {
      const c = card("Por categoría", "Cambio frente al periodo anterior"); host.append(c);
      const by = {}, pby = {};
      cur.forEach(e => by[e.cat] = (by[e.cat] || 0) + Number(e.amount || 0));
      prev.forEach(e => pby[e.cat] = (pby[e.cat] || 0) + Number(e.amount || 0));
      const ranked = Object.entries(by).sort((a, b) => b[1] - a[1]), top = ranked[0][1];
      const wrap = document.createElement("div"); wrap.style.overflowX = "auto";
      wrap.innerHTML = `<table class="ctable"><thead><tr><th>Categoría</th><th>Importe</th><th>%</th><th>Cambio</th></tr></thead><tbody>${
        ranked.map(([k, v]) => {
          const cat = catById(k), p = pby[k] || 0, d = p > 0 ? (v - p) / p : null;
          const dcls = d == null ? "flat" : d > .005 ? "up" : d < -.005 ? "down" : "flat";
          return `<tr><td><div class="cn"><span><i class="dot" style="background:var(${cat.c})"></i>${esc(cat.name)}</span>
            <div class="mini"><i style="width:${(v / top * 100).toFixed(1)}%;background:var(${cat.c})"></i></div></div></td>
            <td>${money(v)}</td><td class="pc">${Math.round(v / total * 100)}%</td>
            <td class="dl ${dcls}">${d == null ? "nuevo" : fmtPct(d)}</td></tr>`;
        }).join("")}</tbody></table>`;
      c.append(wrap);
    }

    // Weekday pattern
    {
      const names = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"], full = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábados", "domingos"];
      const wk = names.map(() => ({v:0, n:0}));
      cur.forEach(e => { const w = (new Date(e.date + "T12:00:00").getDay() + 6) % 7; wk[w].v += Number(e.amount || 0); wk[w].n++; });
      const maxI = wk.reduce((m, w, i) => w.v > wk[m].v ? i : m, 0);
      const c = card("Por día de la semana", `Gastas más los ${full[maxI]}`); host.append(c);
      barChart(chartHost(c), wk.map((w, i) => ({label:names[i], value:w.v, title:full[i], extra:`· ${w.n} ${w.n === 1 ? "gasto" : "gastos"}`})), {maxLabels:7});
    }

    // Facts
    {
      const byDate = {}; cur.forEach(e => byDate[e.date] = (byDate[e.date] || 0) + Number(e.amount || 0));
      const [maxDate, maxDay] = Object.entries(byDate).sort((a, b) => b[1] - a[1])[0];
      const noSpend = days - Object.keys(byDate).length;
      const weekend = cur.filter(e => [0, 6].includes(new Date(e.date + "T12:00:00").getDay()));
      const c = card("Datos del periodo"); host.append(c);
      const fx = document.createElement("div"); fx.className = "facts";
      fx.innerHTML = `
        <div class="fact"><span class="k">Día más caro</span><span class="v num">${money(maxDay)}</span><span class="k">${esc(longDate(maxDate))}</span></div>
        <div class="fact"><span class="k">Días sin gastar</span><span class="v num">${noSpend} de ${days}</span><span class="k">${Math.round(noSpend / days * 100)}% de los días</span></div>
        <div class="fact"><span class="k">Fin de semana</span><span class="v num">${Math.round(total$(weekend) / total * 100)}%</span><span class="k">del gasto total</span></div>
        <div class="fact"><span class="k">Gastos al día</span><span class="v num">${(n / days).toLocaleString(LOCALE, {maximumFractionDigits:1})}</span><span class="k">de media</span></div>`;
      c.append(fx);
    }

    // Biggest expenses
    {
      const c = card("Gastos más grandes"); host.append(c);
      const rows = document.createElement("div"); rows.className = "rows"; rows.style.margin = "0 -16px -16px";
      [...cur].sort((a, b) => b.amount - a.amount).slice(0, 5).forEach(e => {
        const cat = catById(e.cat);
        const r = document.createElement("button"); r.className = "row";
        r.innerHTML = `<span class="badge" style="background:var(${cat.c})">${cat.name[0]}</span>
          <span class="txt"><span class="t1"></span><span class="t2"></span></span><span class="amt num">${money(Number(e.amount))}</span>`;
        r.querySelector(".t1").textContent = e.note || cat.name;
        r.querySelector(".t2").textContent = `${cat.name} · ${new Date(e.date + "T12:00:00").toLocaleDateString(LOCALE, {day:"numeric", month:"short"})}`;
        r.onclick = () => openExpense(e);
        rows.append(r);
      });
      c.append(rows);
    }
  }

  function setTab(t) {
    tab = t;
    $("#tab-gastos").hidden = t !== "gastos";
    $("#tab-analisis").hidden = t !== "analisis";
    $("#tb-gastos").setAttribute("aria-selected", t === "gastos");
    $("#tb-analisis").setAttribute("aria-selected", t === "analisis");
    hideTip(); scrollTo(0, 0);
    try { localStorage.setItem("gastos.tab", t); } catch {}
    render();
  }
  $("#tb-gastos").onclick = () => setTab("gastos");
  $("#tb-analisis").onclick = () => setTab("analisis");
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    period = Number(b.dataset.p);
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    try { localStorage.setItem("gastos.period", period); } catch {}
    renderDash();
  });
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === "analisis") renderDash(); }, 150); });
  try {
    const p = Number(localStorage.getItem("gastos.period"));
    if ([1, 3, 6, 12].includes(p)) { period = p; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", Number(x.dataset.p) === p)); }
  } catch {}

  let tt;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

  local.load();
  let startTab = "gastos";
  try { if (localStorage.getItem("gastos.tab") === "analisis") startTab = "analisis"; } catch {}
  setTab(startTab);
  connect();
})();
</script>

</body></html>
